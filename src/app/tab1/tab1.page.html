<ion-content [fullscreen]="true" class="home-content">
  
  <!-- Corrected Background Video -->
  <video autoplay muted loop playsinline class="background-video">
    <source src="/assets/images/Backgrounds/backvideo.mp4" type="video/mp4">
  </video>

  <!-- Translucent dark overlay -->
  <div class="video-overlay"></div>

  <!-- Top Navbar / Fully transparent Glass type -->
  <div class="top-navbar">
    <div class="nav-brand">
      <span class="brand-icon">🛡️</span>
      <span class="brand-title">Should I Buy It?</span>
    </div>
    <div class="nav-actions">
      <button class="icon-btn" title="Profile">
        <ion-icon name="person-circle-outline"></ion-icon>
      </button>
    </div>
  </div>

  <!-- Main View Container -->
  <div class="main-container">

    <!-- Welcome Header -->
    <div class="header-section">
      <span class="badge">Smart Analysis</span>
      <h2>Is it worth the purchase?</h2>
      <p>Evaluate your impulses before spending your money.</p>
    </div>

    <!-- Main Evaluation Card (Glass) -->
    <div class="evaluation-card">
      <div class="card-title">
        <span class="icon">🛡️</span>
        <h3>New Article</h3>
      </div>
      
      <div class="input-group">
        <label>What product or service is it?</label>
        <input type="text" [(ngModel)]="producto" placeholder="E.g. Bluetooth headphones, Subscription...">
      </div>

      <div class="input-group">
        <label>Product price ($)</label>
        <input type="number" [(ngModel)]="precio" placeholder="0.00">
      </div>

      <div class="input-group">
        <label>How much do you need it? (1 to 10)</label>
        <div class="slider-container">
          <input type="range" min="1" max="10" value="5" class="slider" [(ngModel)]="necesidad" #urgencyRange>
          <span class="slider-value">{{ urgencyRange.value }}</span>
        </div>
      </div>

      <button class="evaluate-btn" (click)="analizarCompra()">
        <span>Analyze Purchase</span>
        <ion-icon name="arrow-forward-outline"></ion-icon>
      </button>
    </div>

    <!-- Tip Card (Glass) -->
    <div class="tip-card">
      <span class="tip-icon">💡</span>
      <div class="tip-content">
        <h4>48-Hour Rule</h4>
        <p>If it's not a vital emergency, wait two days before confirming payment to avoid impulse buying.</p>
      </div>
    </div>

  </div>

</ion-content>
