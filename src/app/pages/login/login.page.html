<ion-content [scrollY]="false">
  
  <!-- Video de Fondo fijado con slot="fixed" -->
  <video autoplay muted loop playsinline class="bg-video" slot="fixed">
    <source src="/assets/images/Backgrounds/backvideo1.mp4" type="video/mp4">
    Tu navegador no soporta videos HTML5.
  </video>

  <!-- Capa oscura también fijada para cubrir toda la pantalla -->
  <div class="video-overlay" slot="fixed"></div>

  <!-- Contenedor principal del modal -->
  <div class="mask">
    <div class="modal">
      <div class="circle" style="background-image: url('/assets/images/PFP/pfp.jpg');"></div>
      <div class="login">
        <h1>Should I Buy It?</h1>
        
        <div class="session-box">
          <span class="session-label">Sesión</span>
          <span class="session-status">{{ sessionStatus }}</span>
          <small>Acceso seguro: requiere usuario y contraseña válidos.</small>
        </div>

        <div class="form-group">
          <input type="text" [(ngModel)]="username" (ngModelChange)="updateSessionStatus()" placeholder="Username">
          <input type="password" [(ngModel)]="password" placeholder="Password">

          <button type="button" (click)="onLogin()">Let me in.</button>

          <button type="button" class="btn-register" (click)="onRegister()">
            Register new account
          </button>
        </div>

        <div *ngIf="availableUsers.length" class="usuarios-registrados" style="margin-top: 16px;">
          <p style="margin: 0 0 8px; font-size: 12px; opacity: 0.8; text-align: left;">Selecciona una cuenta</p>
          <div style="display: flex; flex-wrap: wrap; gap: 8px;">
            <button
              *ngFor="let user of availableUsers"
              type="button"
              (click)="onSelectUser(user.username)"
              style="padding: 7px 10px; border-radius: 999px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); color: white; font-size: 12px; cursor: pointer;"
            >
              {{ user.username }}
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div id="copy">
    <a href="https://github.com/Berzeyker" target="_blank">Crafted by: <b>@Berzeyker</b><br/>:)</a>
  </div>
</ion-content>
